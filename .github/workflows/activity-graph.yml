name: Update coding activity visuals

on:
  schedule:
    # Runs every 12 hours.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both visuals are generated in this single job and published in one push.
# Do not split these into separate workflows: crazy-max/ghaction-github-pages
# replaces the whole "output" branch with build_dir on every run, so two
# independent workflows pushing different files here would overwrite each
# other's file on every alternating run.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0D1117&color=8B949E&line=00F2FE&point=A855F7&area=true&area_color=00F2FE&title_color=00F2FE&hide_border=true&radius=12&custom_title=Coding%20Activity
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}