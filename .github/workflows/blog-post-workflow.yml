name: Latest blog posts

on:
  schedule:
    # Runs daily at 07:00 UTC. Adjust the cron to your preference.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Replace with your site's RSS or Atom feed URL.
          feed_list: "YOUR_SITE_RSS_FEED"
          max_post_count: 5