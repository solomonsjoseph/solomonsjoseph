<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="gSpot" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#2A1B4D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .st { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 0.15; } 50% { opacity: 0.95; } }
  </style>

  <rect width="880" height="240" fill="#0D1117"/>
  <rect width="880" height="240" fill="url(#gSpot)"/>

  <!-- perspective grid floor -->
  <g stroke="#A855F7" stroke-opacity="0.30" stroke-width="1">
    <line x1="440" y1="150" x2="-320" y2="240"/>
    <line x1="440" y1="150" x2="-100" y2="240"/>
    <line x1="440" y1="150" x2="80" y2="240"/>
    <line x1="440" y1="150" x2="260" y2="240"/>
    <line x1="440" y1="150" x2="440" y2="240"/>
    <line x1="440" y1="150" x2="620" y2="240"/>
    <line x1="440" y1="150" x2="800" y2="240"/>
    <line x1="440" y1="150" x2="980" y2="240"/>
    <line x1="440" y1="150" x2="1160" y2="240"/>
    <line x1="0" y1="150" x2="880" y2="150"/>
    <line x1="0" y1="172" x2="880" y2="172"/>
    <line x1="0" y1="196" x2="880" y2="196"/>
    <line x1="0" y1="220" x2="880" y2="220"/>
  </g>

  <!-- glowing horizon line -->
  <line x1="0" y1="150" x2="880" y2="150" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.8">
    <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- scanline sweeping down -->
  <line x1="0" y1="0" x2="880" y2="0" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="y1" from="-10" to="250" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" from="-10" to="250" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- starfield -->
  <g fill="#FFFFFF">
    <circle class="st" cx="60" cy="40" r="1.4"/>
    <circle class="st" cx="180" cy="72" r="1.0" style="animation-delay:0.4s"/>
    <circle class="st" cx="300" cy="30" r="1.8"/>
    <circle class="st" cx="430" cy="60" r="1.2" style="animation-delay:0.9s"/>
    <circle class="st" cx="560" cy="26" r="1.5" style="animation-delay:0.2s"/>
    <circle class="st" cx="690" cy="55" r="1.1" style="animation-delay:1.1s"/>
    <circle class="st" cx="800" cy="33" r="1.6" style="animation-delay:0.6s"/>
    <circle class="st" cx="120" cy="100" r="1.0" style="animation-delay:1.5s"/>
    <circle class="st" cx="760" cy="102" r="1.2" style="animation-delay:0.3s"/>
    <circle class="st" cx="340" cy="95" r="0.9" style="animation-delay:1.8s"/>
    <circle class="st" cx="620" cy="118" r="1.0" style="animation-delay:2.2s"/>
    <circle class="st" cx="210" cy="122" r="1.3" style="animation-delay:1.2s"/>
  </g>

  <!-- title -->
  <text x="440" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="5" fill="url(#gTitle)">SOLOMON S. JOSEPH</text>

  <!-- subtitle -->
  <text x="440" y="147" text-anchor="middle" font-family="Fira Code,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="1" fill="#8B949E">AI Implementation Engineer / Privacy-First AI Systems</text>
</svg>